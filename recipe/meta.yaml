{% set name = "pymdown-extensions" %}
{% set version = "12.2" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/p/pymdown_extensions/pymdown_extensions-{{ version }}.tar.gz
  sha256: 02da896c362b548d85123e7a377a40024ea6ea938b4e45ca064e408afd994b64

build:
  number: 0
  noarch: python
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv '

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling >=0.21.1
  run:
    - python >={{ python_min }}
    - markdown >=3.6
    - pyyaml

test:
  requires:
    - python {{ python_min }}
  imports:
    - pymdownx

about:
  home: https://github.com/facelessuser/pymdown-extensions
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: Extension pack for Python Markdown.
  doc_url: https://facelessuser.github.io/pymdown-extensions/
  dev_url: https://github.com/facelessuser/pymdown-extensions

extra:
  recipe-maintainers:
    - dhirschfeld
    - monaldoj
    - ewels
    - maxibor
